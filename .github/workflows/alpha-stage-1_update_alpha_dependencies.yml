name: Alpha Stage 1 - Update Alpha Dependencies, Create PR, Merge PR and Trigger Alpha Stage 2
on:
  schedule:
    - cron: '0 9 * * *' # 5 AM Eastern (11 AM UTC), Docker updates at 6 AM Eastern (12 PM UTC)
  workflow_dispatch:
run-name: Alpha Stage 1 - ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Scheduled' }} Run

jobs:
  homebridge-alpha-bot:
    name: Run Homebridge Alpha Bot
    uses: homebridge/.github/.github/workflows/homebridge-beta-bot.yml@latest
    with:
      config_file: '.github/homebridge-alpha-bot.json'
      release_stream: 'alpha'
    secrets: inherit

  log-skipped-trigger:
    name: Log Skipped Alpha Stage 2 Trigger
    needs: homebridge-alpha-bot
    if: needs.homebridge-alpha-bot.outputs.changes_detected != 'true' || needs.homebridge-alpha-bot.outputs.auto_merge != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Log Skipped Trigger
        run: |
          echo "::warning::Alpha Stage 2 not triggered: Changes Detected=${{ needs.homebridge-alpha-bot.outputs.changes_detected }}, Auto Merge=${{ needs.homebridge-alpha-bot.outputs.auto_merge }}"

  trigger-alpha-stage-2:
    name: Trigger Build and Release Alpha Package
    needs: homebridge-alpha-bot
    if: needs.homebridge-alpha-bot.outputs.changes_detected == 'true' && needs.homebridge-alpha-bot.outputs.auto_merge == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Trigger Alpha Stage 2 Workflow
        run: |
          echo "::notice::Triggering Alpha Stage 2 - Build and Release Alpha Package"
          gh workflow run alpha-stage-2_build_alpha_release_and_store.yml --ref latest || { echo "::error::Failed to trigger Alpha Stage 2 workflow"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}