name: "Reusable - Build APT Package"

on:
  workflow_call:
    inputs:
      release_type:
        description: 'Release type (stable, beta, alpha)'
        required: true
        type: string
      release_version:
        description: 'Release version string'
        required: true
        type: string
      docker_tag_prefix:
        description: 'Docker tag prefix for build image'
        required: false
        type: string
        default: 'package-build'

jobs:
  build_package_and_store:
    name: Build Packages for (${{ matrix.name }}) v${{ inputs.release_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [
          debian-x86_64,
          debian-arm32v6,
          debian-arm64v8,
        ]
        include: 
          - name: debian-x86_64
            os: ubuntu-latest
            BASE_IMAGE: library/debian:bullseye
            QEMU_ARCH: x86_64

          - name: debian-arm32v6
            os: ubuntu-24.04-arm
            BASE_IMAGE: balenalib/raspberrypi3-debian:bullseye
            QEMU_ARCH: arm

          - name: debian-arm64v8
            os: ubuntu-24.04-arm
            BASE_IMAGE: arm64v8/debian:bullseye
            QEMU_ARCH: aarch64

    steps: 
    - uses: actions/checkout@v4

    - name: Setup build environment X64
      if: runner.os == 'Linux' && runner.arch == 'X64'
      run: |
        sudo apt-get update
        sudo apt-get --yes --no-install-recommends install binfmt-support qemu-user-static
        docker run --rm --privileged multiarch/qemu-user-static:register --reset
      continue-on-error: false

    - name: Setup build environment ARM64
      if: runner.os == 'Linux' && runner.arch == 'ARM64'
      run: |
        sudo apt-get update
        sudo apt-get --yes --no-install-recommends install binfmt-support
      continue-on-error: false

    - name: Build Docker image
      run: |
        docker build -f build/Dockerfile \
          --build-arg BASE_IMAGE=${{ matrix.BASE_IMAGE }} \
          --build-arg QEMU_ARCH=${{ matrix.QEMU_ARCH }} \
          -t ${{ inputs.docker_tag_prefix }}-${{ inputs.release_type }} \
          --platform=linux/${{ matrix.QEMU_ARCH }} \
          --cache-from=${{ inputs.docker_tag_prefix }}-${{ inputs.release_type }}:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 .
      continue-on-error: false

    - name: Build package
      run: |
        docker run --rm -v $(pwd):/repo \
          -e PKG_RELEASE_TYPE="${{ inputs.release_type }}" \
          -e PKG_RELEASE_VERSION="${{ inputs.release_version }}" \
          ${{ inputs.docker_tag_prefix }}-${{ inputs.release_type }}
      continue-on-error: false

    - name: Rename package to include v
      run: |
        DEB_FILE=$(ls homebridge*.deb 2>/dev/null || echo "")
        if [ -z "$DEB_FILE" ]; then
          echo "No .deb file found. Exiting."
          exit 1
        fi
        UPDATED=$(echo "$DEB_FILE" | sed -e 's/homebridge_/homebridge_v/g')
        mv "$DEB_FILE" "$UPDATED"

    - name: Rename manifest to include v
      run: |
        MANIFEST_FILE=$(ls homebridge*.manifest 2>/dev/null || echo "")
        if [ -z "$MANIFEST_FILE" ]; then
          echo "No .manifest file found. Exiting."
          exit 1
        fi
        UPDATED=$(echo "$MANIFEST_FILE" | sed -e 's/homebridge_/homebridge_v/g')
        mv "$MANIFEST_FILE" "$UPDATED"

    - uses: actions/upload-artifact@v4
      with:
        name: artifacts-${{ matrix.name }}
        retention-days: 7
        path: |
          *.deb
          *.manifest