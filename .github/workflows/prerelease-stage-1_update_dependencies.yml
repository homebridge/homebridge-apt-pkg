name: Prerelease Stage 1 - Update Alpha and Beta Dependencies, Create PRs, Merge PRs and Trigger Stage 2

on:
  schedule:
    # Beta: 4 AM Eastern (8 AM UTC), Docker updates at 6 AM Eastern (10 AM UTC)
    - cron: '0 8 * * *'
    # Alpha: 5 AM Eastern (9 AM UTC), Docker updates at 6 AM Eastern (11 AM UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type to update'
        required: true
        type: choice
        options:
          - alpha
          - beta
          - both
        default: 'both'

run-name: Prerelease Stage 1 - ${{ github.event_name == 'workflow_dispatch' && format('Manual - {0}', github.event.inputs.release_type) || 'Scheduled' }} Run

jobs:
  determine-release-types:
    name: Determine Release Types
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix based on trigger
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.release_type }}" == "both" ]]; then
              echo 'matrix={"release_type":["alpha","beta"],"include":[{"release_type":"alpha","config_file":".github/homebridge-alpha-bot.json","trigger_workflow":"prerelease-stage-2_build_and_release.yml"},{"release_type":"beta","config_file":".github/homebridge-beta-bot.json","trigger_workflow":"prerelease-stage-2_build_and_release.yml"}]}' >> $GITHUB_OUTPUT
            else
              CONFIG_FILE=".github/homebridge-${{ github.event.inputs.release_type }}-bot.json"
              echo "matrix={\"release_type\":[\"${{ github.event.inputs.release_type }}\"],\"include\":[{\"release_type\":\"${{ github.event.inputs.release_type }}\",\"config_file\":\"$CONFIG_FILE\",\"trigger_workflow\":\"prerelease-stage-2_build_and_release.yml\"}]}" >> $GITHUB_OUTPUT
            fi
          else
            # Scheduled run - determine based on cron time
            CURRENT_HOUR=$(date -u +%H)
            if [[ "$CURRENT_HOUR" == "08" ]]; then
              # Beta cron at 8 AM UTC
              echo 'matrix={"release_type":["beta"],"include":[{"release_type":"beta","config_file":".github/homebridge-beta-bot.json","trigger_workflow":"prerelease-stage-2_build_and_release.yml"}]}' >> $GITHUB_OUTPUT
            elif [[ "$CURRENT_HOUR" == "09" ]]; then
              # Alpha cron at 9 AM UTC
              echo 'matrix={"release_type":["alpha"],"include":[{"release_type":"alpha","config_file":".github/homebridge-alpha-bot.json","trigger_workflow":"prerelease-stage-2_build_and_release.yml"}]}' >> $GITHUB_OUTPUT
            else
              echo "::error::Unexpected scheduled run time: $CURRENT_HOUR"
              exit 1
            fi
          fi

  update_dependencies:
    name: Update ${{ matrix.release_type }} Dependencies
    needs: determine-release-types
    strategy:
      matrix: ${{ fromJson(needs.determine-release-types.outputs.matrix) }}
    uses: ./.github/workflows/reusable-update-dependencies.yml
    with:
      release_type: ${{ matrix.release_type }}
      config_file: ${{ matrix.config_file }}
      trigger_workflow: ${{ matrix.trigger_workflow }}
    secrets: inherit
