name: Stage 4 - Post Release Validation

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: "APT release channel to validate"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - alpha

  workflow_run:
    workflows:
      - "Stage 3 - Promote Release Package to APT Stores"
      - "Beta Stage 2 - Build and Release Beta Package"
      - "Alpha Stage 2 - Build and Release Alpha Package"
    types:
      - completed

jobs:
  determine-channel:
    name: Determine Release Channel
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      channel: ${{ steps.set.outputs.release_channel }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "release_channel=${{ github.event.inputs.release_channel }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.workflow_run.name }}" == "Beta Stage 2 - Build and Release Beta Package" ]]; then
            echo "release_channel=beta" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.workflow_run.name }}" == "Alpha Stage 2 - Build and Release Alpha Package" ]]; then
            echo "release_channel=alpha" >> $GITHUB_OUTPUT
          else
            echo "release_channel=stable" >> $GITHUB_OUTPUT
          fi

  validate:
    needs: determine-channel
    uses: ./.github/workflows/reusable-validate-homebridge.yml
    with:
      validation_type: "apt"
      release_channel: ${{ needs.determine-channel.outputs.channel }}
