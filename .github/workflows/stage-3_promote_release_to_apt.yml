name: "Stage 3 - Promote Release Package to APT Stores"

on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "The tag of the release to Package to APT Stores."
        required: true
        type: string

jobs:
  determine_release_tag:
    name: Determine Release Tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set_release_tag.outputs.release_tag }}
    steps:
      - name: Set Release Tag
        id: set_release_tag
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "release_tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

  release_type:
    name: Determine Release Type
    runs-on: ubuntu-latest
    needs: determine_release_tag
    outputs:
      release_type: ${{ steps.release_type.outputs.type }}
    steps:
      - name: Determine Release Type
        id: release_type
        run: |
          if [ "${{ github.event.release.prerelease }}" == "true" ]; then
            echo "type=test" >> "$GITHUB_OUTPUT"
          else
            echo "type=stable" >> "$GITHUB_OUTPUT"
          fi

  update_apt_repo:
    needs: [determine_release_tag, release_type]
    uses: ./.github/workflows/reusable-publish-apt.yml
    with:
      codename: ${{ needs.release_type.outputs.release_type }}
      suite: stable
      release_version: ${{ needs.determine_release_tag.outputs.release_tag }}
      download_from_release: true
      release_tag: ${{ needs.determine_release_tag.outputs.release_tag }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  purge_cloudflare_cache:
    name: Purge Cloudflare Cache
    needs: update_apt_repo
    uses: ./.github/workflows/stage-3_5_purge_cloudflare_cache.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  notify_discord:
    name: Notify Discord
    needs: [update_apt_repo, purge_cloudflare_cache, determine_release_tag]
    uses: homebridge/.github/.github/workflows/discord-webhooks.yml@latest
    with:
      title: "Homebridge APT Package Released"
      description: "Version `${{ needs.determine_release_tag.outputs.release_tag }}` has been released."
      url: "https://github.com/homebridge/homebridge-apt-pkg/releases/tag/${{ needs.determine_release_tag.outputs.release_tag }}"
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_LATEST }}

  print_context:
    uses: ./.github/workflows/reusable-debug-context.yml