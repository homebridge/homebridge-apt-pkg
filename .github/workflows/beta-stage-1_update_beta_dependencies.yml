name: Beta Stage 1 - Update Beta Dependencies, Create PR, Merge PR and Trigger Beta Stage 2

on:
  schedule:
    - cron: '0 8 * * *'  # 4 AM Eastern (10 AM UTC), Docker updates at 6 AM Eastern (12 PM UTC)
  workflow_dispatch:

jobs:
  call-beta-stage-1:
    uses: homebridge/.github/.github/homebridge-beta-bot.yml@latest
    with:
      config_file: '.github/homebridge/beta-bot.json'
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}
  trigger-beta-stage-2:
    needs: call-beta-stage-1
    if: needs.call-beta-stage-1.outputs.changes_detected == 'true' && needs.call-beta-stage-1.outputs.auto_merge == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Beta Stage 2 Workflow
        run: |
          echo "::notice::Triggering Beta Stage 2 - Build and Release Beta Package"
          gh workflow run beta-stage-2_build_beta_release_and_store.yml --ref latest || { echo "::error::Failed to trigger Beta Stage 2 workflow"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}