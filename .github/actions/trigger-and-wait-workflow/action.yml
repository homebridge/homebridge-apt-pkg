name: 'Trigger and Wait for Workflow'
description: 'Starts a workflow, finds the run it created, and waits until that run has finished. Fails when the run fails or takes too long.'
inputs:
  workflow-file:
    description: 'The workflow file to trigger (e.g., release-stage-2_build_and_release.yml)'
    required: true
  ref:
    description: 'The git ref to run the workflow on'
    required: true
    default: 'latest'
  release-type:
    description: 'The release type parameter to pass to the workflow'
    required: true
  scheduled:
    description: 'The scheduled parameter to pass to the workflow (Scheduled or Manual)'
    required: false
    default: 'Manual'
  github-token:
    description: 'GitHub token that may start workflows and read runs (actions: write)'
    required: true
  timeout-minutes:
    description: 'Maximum wait time in minutes'
    required: false
    default: '150'

outputs:
  workflow-conclusion:
    description: 'The conclusion of the triggered workflow'
    value: ${{ steps.wait-completion.outputs.conclusion }}
  run-id:
    description: 'The run ID of the triggered workflow'
    value: ${{ steps.trigger.outputs.run_id }}

runs:
  using: 'composite'
  steps:
    - name: Trigger ${{ inputs.release-type }} Workflow and find its run
      id: trigger
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        REF: ${{ inputs.ref }}
        RELEASE_TYPE: ${{ inputs.release-type }}
        SCHEDULED: ${{ inputs.scheduled }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        list_runs() {
          gh run list --workflow "$WORKFLOW_FILE" --event workflow_dispatch --limit 30 \
            --json databaseId,displayTitle,createdAt
        }

        # The runs that exist before the trigger. The new run is the one that is not in this list.
        list_runs > "$RUNNER_TEMP/runs-before.json"

        echo "::notice::Triggering $RELEASE_TYPE workflow - $WORKFLOW_FILE"
        gh workflow run "$WORKFLOW_FILE" --ref "$REF" \
          --field release_type="$RELEASE_TYPE" \
          --field Scheduled="$SCHEDULED"

        # The triggered workflow names its runs "Release Stage 2 - <Scheduled|Manual> - <type> Run"
        TITLE="- $SCHEDULED - $RELEASE_TYPE Run"
        RUN_ID=""
        for attempt in $(seq 1 24); do
          sleep 5
          list_runs > "$RUNNER_TEMP/runs-after.json" || continue
          RUN_ID=$("$ACTION_PATH/select-new-run.sh" "$RUNNER_TEMP/runs-before.json" "$RUNNER_TEMP/runs-after.json" "$TITLE")
          [ -n "$RUN_ID" ] && break
          echo "Try $attempt of 24: the new run is not listed yet."
        done

        if [ -z "$RUN_ID" ]; then
          echo "::error::Could not find the triggered $RELEASE_TYPE run after 2 minutes"
          cat "$RUNNER_TEMP/runs-after.json"
          exit 1
        fi
        echo "::notice::Found the triggered run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
        echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

    - name: Wait for ${{ inputs.release-type }} Workflow Completion
      id: wait-completion
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RUN_ID: ${{ steps.trigger.outputs.run_id }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/wait-for-run.sh" "$RUN_ID" "$TIMEOUT_MINUTES"'
