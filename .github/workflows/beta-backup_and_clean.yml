name: Backup and Reset Beta APT Repository

on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: 'Erase beta codename (true/false)'
        required: true
        default: 'false'

jobs:
  backup_and_reset_beta:
    name: Backup and Reset Beta Codename
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Backup Beta Codename
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_PATH="s3://repo.homebridge.io/backup/beta-$TIMESTAMP/"
          aws s3 sync s3://repo.homebridge.io/dists/beta/ beta_backup/dists/
          aws s3 sync s3://repo.homebridge.io/pool/beta/ beta_backup/pool/
          aws s3 cp beta_backup/ "$BACKUP_PATH" --recursive
          echo "Backup URL: https://repo.homebridge.io/backup/beta-$TIMESTAMP/"
          echo "BACKUP_URL=https://repo.homebridge.io/backup/beta-$TIMESTAMP/" >> $GITHUB_ENV

      - name: Output Backup URL
        run: |
          echo "Backup available at: ${{ env.BACKUP_URL }}"

      - name: Delete Beta Metadata
        if: github.event.inputs.cleanup == 'true'
        run: |
          aws s3 rm s3://repo.homebridge.io/dists/beta/ --recursive
          echo "Deleted dists/beta/"

      - name: Delete Beta Packages
        if: github.event.inputs.cleanup == 'true'
        run: |
          aws s3 rm s3://repo.homebridge.io/pool/beta/ --recursive
          echo "Deleted pool/beta/"

      - name: Verify Deletion
        if: github.event.inputs.cleanup == 'true'
        run: |
          aws s3 ls s3://repo.homebridge.io/dists/beta/ || echo "dists/beta/ is empty"
          aws s3 ls s3://repo.homebridge.io/pool/beta/ || echo "pool/beta/ is empty"

      - name: Verify Stable Codename
        run: |
          aws s3 ls s3://repo.homebridge.io/dists/stable/ | grep -q stable && echo "stable codename is intact"