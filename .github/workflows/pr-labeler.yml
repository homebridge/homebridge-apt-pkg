name: PR Labeler

on:
  pull_request_target: # required for auto labeler
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions: {}

jobs:
  label:
    permissions:
      contents: read
      pull-requests: write
    # the shared workflow that reads .github/labeler.yml (labels a pull request by its base branch),
    # the same one the other Homebridge repos use
    uses: homebridge/.github/.github/workflows/labeler.yml@latest
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
