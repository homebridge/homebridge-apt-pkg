name: Release Stage 2 - Build, Prerelease, Validate, and Publish
run-name: Release Stage 2 - ${{ github.event.inputs.Scheduled}} - ${{ github.event.inputs.release_type}} Run

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type to build'
        required: true
        type: choice
        options:
          - alpha
          - beta
          - stable
          - legacy
        default: 'alpha'
      Scheduled:
        description: 'Whether this is a scheduled run'
        required: false
        type: choice
        options:
          - Scheduled
          - Manual
        default: Manual
      release_increment:
        description: 'Version increment for stable releases'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      allow_downgrade:
        description: 'Allow a bundled version (Node.js, Homebridge, UI) to go DOWN compared with the last release of this stream'
        required: false
        type: boolean
        default: false

# No rights by default. Each job below names the rights it needs.
# Releases are made with the GitHub App token, not with the workflow's own token.
permissions: {}

concurrency:
  group: release-stage-2
  cancel-in-progress: false

jobs:

  # Stop before anything is built if a bundled version went down (see scripts/check-version-downgrade.sh)
  preflight:
    name: Check that no bundled version goes down
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare with the last ${{ inputs.release_type }} release
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          ALLOW_VERSION_DOWNGRADE: ${{ inputs.allow_downgrade && '1' || '0' }}
        run: ./scripts/check-version-downgrade.sh "$RELEASE_TYPE"

  # For alpha/beta releases, generate version using date-based approach
  generate_version:
    if: ${{ inputs.release_type!= 'stable' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version_output.outputs.version }}
      npm_version: ${{ steps.version_output.outputs.npm_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Get base version
        uses: reecetech/version-increment@28d33de033e97a304f77238d6a5db26039ca15d6 # 2026.8.4
        id: release_version
        with:
          scheme: semver
          increment: patch

      - name: Generate version
        id: version_output
        env:
          BASE_VERSION: ${{ steps.release_version.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          # A second build on the same day gets its own version (see the script).
          git fetch --quiet --force origin 'refs/tags/*:refs/tags/*'
          ./scripts/next-prerelease-version.sh "$BASE_VERSION" "$RELEASE_TYPE" | tee -a "$GITHUB_OUTPUT"
          echo "::notice::📦 $RELEASE_TYPE version: $(sed -n 's/^version=//p' "$GITHUB_OUTPUT")"

  # For stable releases, generate version using semver increment
  generate_stable_version:
    if: ${{  inputs.release_type== 'stable' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      npm_version: ${{ steps.release_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get next stable version
        uses: reecetech/version-increment@28d33de033e97a304f77238d6a5db26039ca15d6 # 2026.8.4
        id: release_version
        with:
          scheme: semver
          increment: ${{ inputs.release_increment }}

  build_packages:
    name: Build Packages for (${{ matrix.name }}) v${{ needs.generate_version.outputs.version || needs.generate_stable_version.outputs.version }}
    needs: [preflight, generate_version, generate_stable_version]
    if: always() && needs.preflight.result == 'success' && (needs.generate_version.result == 'success' || needs.generate_stable_version.result == 'success')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each architecture builds on a runner that can run its programs directly (no emulation).
        # The build image for each one is set in scripts/build-local.sh.
        include:
          - name: debian-x86_64
            os: ubuntu-latest
            QEMU_ARCH: x86_64

          - name: debian-arm32v7
            os: ubuntu-24.04-arm
            QEMU_ARCH: arm

          - name: debian-arm64v8
            os: ubuntu-24.04-arm
            QEMU_ARCH: aarch64

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Build package
      env:
        RELEASE_TYPE: ${{ inputs.release_type }}
        QEMU_ARCH: ${{ matrix.QEMU_ARCH }}
        PKG_RELEASE_VERSION: ${{ needs.generate_version.outputs.version || needs.generate_stable_version.outputs.version }}
      run: ./scripts/build-local.sh "$RELEASE_TYPE" "$QEMU_ARCH" "$PKG_RELEASE_VERSION"

    - name: Rename package to include v
      run: |
        DEB_FILE=$(ls homebridge*.deb 2>/dev/null || echo "")
        if [ -z "$DEB_FILE" ]; then
          echo "No .deb file found. Exiting."
          exit 1
        fi
        UPDATED=$(echo "$DEB_FILE" | sed -e 's/homebridge_/homebridge_v/g')
        mv "$DEB_FILE" "$UPDATED"

    - name: Rename manifest to include v
      run: |
        MANIFEST_FILE=$(ls homebridge*.manifest 2>/dev/null || echo "")
        if [ -z "$MANIFEST_FILE" ]; then
          echo "No .manifest file found. Exiting."
          exit 1
        fi
        UPDATED=$(echo "$MANIFEST_FILE" | sed -e 's/homebridge_/homebridge_v/g')
        mv "$MANIFEST_FILE" "$UPDATED"

    - uses: actions/upload-artifact@v7
      with:
        name: artifacts-${{ matrix.name }}
        retention-days: 7
        path: |
          *.deb
          *.manifest

  # Step 1: Create prerelease for all release types
  create_prerelease:
    name: Create GitHub Prerelease v${{ needs.generate_version.outputs.npm_version || needs.generate_stable_version.outputs.npm_version }}
    needs: [generate_version, generate_stable_version, build_packages]
    if: always() && (needs.generate_version.result == 'success' || needs.generate_stable_version.result == 'success') && needs.build_packages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release_details.outputs.tag_name  }}
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          owner: homebridge
          repositories: homebridge-apt-pkg
          permission-contents: write
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R

      - name: Get the date
        id: date
        run: |
          echo "builddate=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release Body
        id: release_body
        run: |
          echo "BODY_FILE=$(ls *.manifest | head -n 1)" >> $GITHUB_OUTPUT

      - name: Determine release details
        id: release_details
        run: |
          RELEASE_TYPE="${{ inputs.release_type}}"
          if [[ "$RELEASE_TYPE" == "stable" ]]; then
            VERSION="${{ needs.generate_stable_version.outputs.version }}"
            NPM_VERSION="${{ needs.generate_stable_version.outputs.npm_version }}"
            TITLE="v$VERSION - ${{ steps.date.outputs.builddate }}"
          else
            VERSION="${{ needs.generate_version.outputs.version }}"
            NPM_VERSION="${{ needs.generate_version.outputs.npm_version }}"
            TITLE_PREFIX=$(echo "$RELEASE_TYPE" | tr '[:lower:]' '[:upper:]')
            TITLE="$TITLE_PREFIX: Homebridge APT Pkg Release v$NPM_VERSION"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "npm_version=$NPM_VERSION" >> $GITHUB_OUTPUT
          echo "release_title=$TITLE" >> $GITHUB_OUTPUT
          echo "tag_name=v$NPM_VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Prerelease
        id: create_release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release_details.outputs.tag_name }}
          TITLE: ${{ steps.release_details.outputs.release_title }}
          BODY_FILE: ${{ steps.release_body.outputs.BODY_FILE }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, clearing attachments and updating"
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release edit "$TAG" --title "$TITLE" --notes-file "$BODY_FILE" --prerelease --draft=false
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$BODY_FILE" --prerelease
          fi
          gh release upload "$TAG" *.deb *.manifest --clobber

      - name: Set release tag output
        run: |
          echo "release_tag=${{ steps.release_details.outputs.tag_name }}" >> $GITHUB_OUTPUT

  prelease_created_notice:
    name: Prerelease Created Notice
    needs: [create_prerelease]
    if: always() && needs.create_prerelease.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Output Success Notice
        run: echo "::notice::📦 Created prerelease ${{ needs.create_prerelease.outputs.release_tag }} with ${{ inputs.release_type}} changes"

  # Step 2: Validate the prerelease packages BEFORE anything is published:
  # install (as an upgrade from the published package), start, versions, remove, purge.
  # Intel and 64-bit ARM on real runners, 32-bit ARM in a container.
  validate_prerelease:
    name: Validate GitHub Prerelease Artifacts
    needs: [create_prerelease, prelease_created_notice]
    if: always() && needs.create_prerelease.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-validate-homebridge.yml
    with:
      validation_type: "prerelease"
      release_tag: ${{ needs.create_prerelease.outputs.release_tag }}
      release_channel: ${{ inputs.release_type }}

  # Step 3: Promote prerelease to full release after validation passes
  promote_to_release:
    name: Promote to Full Release
    needs: [validate_prerelease, create_prerelease]
    if: always() && needs.validate_prerelease.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          owner: homebridge
          repositories: homebridge-apt-pkg
          permission-contents: write
      - name: Promote prerelease to full release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ needs.create_prerelease.outputs.release_tag }}
        run: |
          # Every stream becomes a full release here (docker-homebridge downloads the .deb from it).
          # "--latest=false" says in so many words that this step never makes a release the
          # "latest" one: an alpha, beta or legacy release must never become "latest". A stable
          # release is marked as latest by the "mark_latest" job, after the APT repository check.
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest=false
          echo "Promoted prerelease to full release: $RELEASE_TAG"

  # Step 4: Publish to APT repository
  publish_apt:
    name: Publish to APT Repository
    needs: [promote_to_release, create_prerelease, generate_version, generate_stable_version]
    if: always() && needs.promote_to_release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download from GitHub Release
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          tag: ${{ needs.create_prerelease.outputs.release_tag }}
          fileName: 'homebridge*.deb'
          out-file-path: 'repo/'

      - name: Display structure of downloaded files
        run: ls -R

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Install deb-s3
        uses: ./.github/actions/install-deb-s3

      - name: Upload to APT Repository
        env:
          # the keys reach the command through the environment, never as text in this file
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          CHANNEL: ${{ inputs.release_type }}
        run: |
          sudo chown -R "$USER": repo/
          deb-s3 upload \
            --codename="$CHANNEL" \
            --suite="$CHANNEL" \
            --preserve-versions \
            --s3-region=us-west-2 \
            --bucket repo.homebridge.io \
            --access-key-id="$AWS_ACCESS_KEY_ID" \
            --secret-access-key="$AWS_SECRET_ACCESS_KEY" \
            --sign="$GPG_KEY_ID" \
            repo/homebridge_v*.deb repo/*.deb

  # Step 4b: Publish to the Cloudflare R2 APT repository, in parallel with S3.
  # Independent of the S3 jobs and never fails the release (continue-on-error inside).
  publish_apt_r2:
    name: Publish to R2 APT Repository
    needs: [promote_to_release, create_prerelease, generate_version, generate_stable_version]
    if: always() && needs.promote_to_release.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-publish_apt_r2.yml
    with:
      release_tag: ${{ needs.create_prerelease.outputs.release_tag }}
      version: ${{ needs.generate_version.outputs.version || needs.generate_stable_version.outputs.version }}
      npm_version: ${{ needs.generate_version.outputs.npm_version || needs.generate_stable_version.outputs.npm_version }}
      release_channel: ${{ inputs.release_type }}
    # only the secrets this job uses (not "secrets: inherit", which hands over all of them)
    secrets:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Step 5: Purge CloudFlare cache
  purge_cloudflare_cache:
    name: Purge Cloudflare Cache
    needs: [publish_apt]
    if: always() && needs.publish_apt.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-purge_cloudflare_cache.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Step 6: Validate APT installation after publishing
  validate_apt:
    name: Validate APT Installation
    needs: [purge_cloudflare_cache, publish_apt, generate_version, generate_stable_version]
    if: always() && needs.publish_apt.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-validate-homebridge.yml
    with:
      validation_type: "apt"
      release_channel: ${{ inputs.release_type }}
      expected_version: ${{ needs.generate_version.outputs.version || needs.generate_stable_version.outputs.version }}

  # Step 7: Publish to NPM
  publish_to_npm:
    name: Publish to NPM
    needs: [validate_apt, create_prerelease, generate_version, generate_stable_version]
    if: always() && needs.validate_apt.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the right to publish to npm (trusted publishing). Only this job has it.
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node.js 24 comes with npm 11, the same as the other Homebridge repos publish with
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Create package.json from the ${{ inputs.release_type }} release stream
        run: |
          # The npm stub is the stream's 64-bit manifest, so its dependencies record exactly
          # what this apt release contains. There is no package.json in the repo root.
          NPM_VERSION="${{ needs.generate_version.outputs.npm_version || needs.generate_stable_version.outputs.npm_version }}"
          STREAM_PACKAGE_JSON="${{ inputs.release_type }}/64bit/package.json"
          echo "Creating package.json from $STREAM_PACKAGE_JSON with version $NPM_VERSION"
          jq --arg version "$NPM_VERSION" \
            '.name = "@homebridge/homebridge-apt-pkg" | .version = $version | .scripts = {"prepublishOnly": "cp README.npm.md README.md"}' \
            "$STREAM_PACKAGE_JSON" > package.json
          cat package.json

      - name: Publish to npm
        run: npm publish --access public --tag ${{ inputs.release_type== 'stable' && 'latest' || inputs.release_type}}

      - name: Output Success Notice
        run: echo "::notice::Published @homebridge/homebridge-apt-pkg as version ${{ needs.generate_version.outputs.npm_version || needs.generate_stable_version.outputs.npm_version }} with ${{ inputs.release_type== 'stable' && 'latest' || inputs.release_type}} tag"

  # Step 8: Notify Discord (for stable releases only)
  notify_discord:
    name: Notify Discord
    needs: [publish_to_npm, create_prerelease]
    if: always() && needs.publish_to_npm.result == 'success' && inputs.release_type== 'stable'
    permissions: {}
    uses: homebridge/.github/.github/workflows/discord-webhooks.yml@latest
    with:
      title: "Homebridge APT Package Released"
      description: "Version `${{ needs.create_prerelease.outputs.release_tag }}` has been released."
      url: "https://github.com/homebridge/homebridge-apt-pkg/releases/tag/${{ needs.create_prerelease.outputs.release_tag }}"
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_LATEST }}

  # Step 9: Mark a stable release as "latest" on GitHub, once it can be installed from the APT repository.
  # README.md sends manual installers to the "latest" release page.
  # The "always()" matters: the alpha/beta version job is skipped on a stable run, and without
  # "always()" GitHub then skips this job too (that is how "latest" got stuck on v1.7.12).
  mark_latest:
    name: Mark Stable Release as Latest
    needs: [create_prerelease, validate_apt]
    if: always() && needs.validate_apt.result == 'success' && inputs.release_type == 'stable'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          owner: homebridge
          repositories: homebridge-apt-pkg
          permission-contents: write

      - name: Mark Stable Release as Non-Prerelease and Latest
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ needs.create_prerelease.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
