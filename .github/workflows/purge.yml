name: "Purge Old Releases"

on:
  workflow_dispatch:
    inputs:
      min_version:
        description: 'Oldest version to keep (x.x.x). Everything lower is removed.'
        required: true
      release_type:
        type: choice
        description: Release Type
        options:
        - stable
        - beta
        - alpha
        - legacy
        - test
      dry_run:
        type: boolean
        description: 'Dry run: only list what would be removed'
        default: true

jobs:
  purge_old_releases:
    name: Purge Old Releases
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7

    - name: Import GPG key
      id: import_gpg
      uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.GPG_PASSPHRASE }}
      
    - name: Install deb-s3
      uses: ./.github/actions/install-deb-s3

    - name: Purge from S3
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        MIN_VERSION: ${{ github.event.inputs.min_version }}
        RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        S3_BUCKET: repo.homebridge.io
        S3_REGION: us-west-2
      run: ./purge.sh

    - name: Update Repo
      if: ${{ !inputs.dry_run }}
      run: |
        deb-s3 verify \
          --codename=${{ github.event.inputs.release_type }} \
          --s3-region=us-west-2 \
          --bucket repo.homebridge.io \
          --access-key-id=${{ secrets.AWS_ACCESS_KEY_ID }} \
          --secret-access-key=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
          --sign=${{ secrets.GPG_KEY_ID }} \
          --fix-manifests

  purge_cloudflare_cache:
    name: Clear Cache
    needs: purge_old_releases
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/reusable-purge_cloudflare_cache.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
