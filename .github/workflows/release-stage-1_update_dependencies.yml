name: Release Stage 1 - Update Alpha, Beta, and Stable Dependencies, Create PRs, Merge PRs and Trigger Stage 2

on:
  schedule:
    # Process alpha, beta, and stable streams at 8 AM UTC daily
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type to update'
        required: true
        type: choice
        options:
          - alpha
          - beta
          - stable
          - all
        default: 'alpha'

run-name: Release Stage 1 - ${{ github.event_name == 'workflow_dispatch' && format('Manual - {0}', github.event.inputs.release_type) || 'Scheduled' }} Run

jobs:
  determine-release-types:
    name: Determine Release Types
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix based on trigger
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.release_type }}" == "all" ]]; then
              echo 'matrix={"release_type":["stable","beta","alpha"]}' >> $GITHUB_OUTPUT
            else
              echo "matrix={\"release_type\":[\"${{ github.event.inputs.release_type }}\"]}" >> $GITHUB_OUTPUT
            fi
          else
            # Scheduled run - process stable, beta, and alpha streams
            echo 'matrix={"release_type":["stable","beta","alpha"]}' >> $GITHUB_OUTPUT
          fi

  update_dependencies:
    name: Update ${{ matrix.release_type }} Dependencies
    needs: determine-release-types
    strategy:
      max-parallel: 1
      matrix: ${{ fromJson(needs.determine-release-types.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Run Homebridge ${{ matrix.release_type }} Bot
        id: homebridge-bot
        uses: NorthernMan54/Homebridge-Dependency-Bot@latest 
        with:
          config_file: '.github/homebridge-${{ matrix.release_type }}-bot.json'
          release_stream: ${{ matrix.release_type }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}  # Separate token for PR approval

      - name: Log Skipped ${{ matrix.release_type }} Stage 2 Trigger
        if: steps.homebridge-bot.outputs.changes_detected != 'true' || steps.homebridge-bot.outputs.auto_merge != 'true'
        run: |
          echo "::warning::${{ matrix.release_type }} Stage 2 not triggered: Changes Detected=${{ steps.homebridge-bot.outputs.changes_detected }}, Auto Merge=${{ steps.homebridge-bot.outputs.auto_merge }}"

      - name: Checkout repository (for trigger step)
        if: steps.homebridge-bot.outputs.changes_detected == 'true' && steps.homebridge-bot.outputs.auto_merge == 'true'
        uses: actions/checkout@v4

      - name: Trigger Build and Release ${{ matrix.release_type }} Package
        if: steps.homebridge-bot.outputs.changes_detected == 'true' && steps.homebridge-bot.outputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "::notice::Triggering ${{ matrix.release_type }} Stage 2 - Build and Release ${{ matrix.release_type }} Package"
          
          # Trigger the workflow and capture the run URL
          WORKFLOW_URL=$(gh workflow run release-stage-2_build_and_release.yml \
            --ref latest \
            --field release_type=${{ matrix.release_type }} \
            --field Scheduled=${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Scheduled' }} \
            2>&1) || { 
            echo "::error::Failed to trigger ${{ matrix.release_type }} Stage 2 workflow"; 
            exit 1; 
          }
          
          # Extract run ID from the URL (format: https://github.com/owner/repo/actions/runs/RUN_ID)
          if [[ "$WORKFLOW_URL" =~ actions/runs/([0-9]+) ]]; then
            RUN_ID="${BASH_REMATCH[1]}"
            echo "::notice::Triggered ${{ matrix.release_type }} workflow run ID: $RUN_ID"
            
            # Wait for the workflow to complete before proceeding
            echo "::notice::Waiting for ${{ matrix.release_type }} Stage 2 workflow (run $RUN_ID) to complete..."
            gh run watch "$RUN_ID" --exit-status || {
              echo "::error::${{ matrix.release_type }} Stage 2 workflow failed or was cancelled"
              exit 1
            }
            
            echo "::notice::${{ matrix.release_type }} Stage 2 workflow completed successfully"
          else
            echo "::error::Could not extract run ID from workflow trigger output: $WORKFLOW_URL"
            exit 1
          fi