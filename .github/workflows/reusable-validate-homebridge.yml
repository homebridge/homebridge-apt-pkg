name: "Reusable - Validate Homebridge Package"
run-name: "Reusable - Validate Homebridge Package - ${{ github.event.inputs.validation_type }} - ${{ github.event.inputs.release_channel || 'N/A' }}"

on:

  workflow_dispatch:
    inputs:
      validation_type:
        description: "Type of validation to perform"
        required: true
        type: choice
        options:
          - prerelease
          - apt
        default: apt
        # Options: "prerelease" (validate GitHub release), "apt" (validate APT installation)
      release_tag:
        description: "Release tag for GitHub release validation"
        required: false
        type: string
      release_channel:
        description: "APT release channel for APT validation"
        required: false
        type: choice
        options:
          - stable
          - beta
          - alpha
        default: alpha
        # Options: "stable", "beta", "alpha"
      prerelease:
        description: "Whether to download from prerelease"
        required: false
        type: boolean
        default: false
      latest:
        description: "Whether to download latest release"
        required: false
        type: boolean
        default: false

  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
    inputs:
      validation_type:
        description: "Type of validation to perform"
        required: true
        type: string
        # Options: "prerelease" (validate GitHub release), "apt" (validate APT installation)
      release_tag:
        description: "Release tag for GitHub release validation"
        required: false
        type: string
      release_channel:
        description: "APT release channel for APT validation"
        required: false
        type: string
        # Options: "stable", "beta", "alpha"
      prerelease:
        description: "Whether to download from prerelease"
        required: false
        type: boolean
        default: false
      latest:
        description: "Whether to download latest release"
        required: false
        type: boolean
        default: false

jobs:
  validate_prerelease_homebridge:
    name: Validate Homebridge PreRelease Package
    if: inputs.validation_type == 'prerelease'
    runs-on: ubuntu-latest
    steps:
      - name: Validate GitHub Release Package
        run: |
          echo "Starting GitHub release package validation..."

      - name: Download prerelease assets
        id: download_assets
        uses: robinraju/release-downloader@v1.12
        with:
          tag: ${{ inputs.release_tag }}
          preRelease: ${{ inputs.prerelease }}
          latest: ${{ inputs.latest }}
          fileName: 'homebridge*.deb'

      - name: List the downloaded files
        run: ls -l

      - name: Check the number of downloaded files
        id: check_file_count
        run: |
          FILE_COUNT=$(ls -1 | wc -l)
          echo "Number of files downloaded: $FILE_COUNT"
          if [ "$FILE_COUNT" -ne 3 ]; then
            echo "::error::Expected 3 files, but found $FILE_COUNT"
            exit 1
          fi

      - name: Download and install AMD64 package
        uses: robinraju/release-downloader@v1.12
        with:
          tag: ${{ inputs.release_tag }}
          preRelease: ${{ inputs.prerelease }}
          latest: ${{ inputs.latest }}
          fileName: 'homebridge_*_amd64.deb'

      - name: List downloaded files
        run: |
          echo "Downloaded files:"
          ls -l

      - name: Install the downloaded package
        run: |
          sudo dpkg -i homebridge_*_amd64.deb || sudo apt-get install -f -y
          sleep 30

      - name: Validate Homebridge Service (prerelease)
        run: |
          sudo hb-service view
          sudo hb-service status

  validate_apt:
    name: Validate APT Installation
    if: inputs.validation_type == 'apt'
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Homebridge from APT
        continue-on-error: true
        run: |
          curl -sSfL https://repo.homebridge.io/KEY.gpg | sudo gpg --dearmor -o /usr/share/keyrings/homebridge.gpg
          echo "deb [signed-by=/usr/share/keyrings/homebridge.gpg] https://repo.homebridge.io ${{ inputs.release_channel }} main" | \
            sudo tee /etc/apt/sources.list.d/homebridge.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y homebridge

      - name: Display Installed Version
        if: success()
        id: installed-version
        run: |
          dpkg -l homebridge
          echo "homebridge-version=\"$(dpkg -l homebridge | tail -1 | awk '{ print $3 }')\"" >> "$GITHUB_OUTPUT"

      - name: Validate Homebridge Service
        if: success()
        run: |
          sudo hb-service status
          sudo hb-service view

      - name: List Available Versions
        if: success()
        run: |
          apt-cache madison homebridge

      - name: Publish Notice
        if: success()
        run: |
          echo "::notice::APT Package Installed from ${{ inputs.release_channel }} - Version ${{ steps.installed-version.outputs.homebridge-version }} - ${{ matrix.os }}"

      - name: Configure AWS Credentials
        if: failure()
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Display Current ${{ inputs.release_channel }} Codename
        if: failure()
        run: |
          aws s3 ls --recursive s3://repo.homebridge.io/dists/${{ inputs.release_channel }}/ || echo "No ${{ inputs.release_channel }} codename found"
          aws s3 ls --recursive s3://repo.homebridge.io/pool/${{ inputs.release_channel }}/ || echo "No ${{ inputs.release_channel }} codename found"
