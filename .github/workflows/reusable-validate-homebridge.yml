name: "Reusable - Validate Homebridge Package"
run-name: "Reusable - Validate Homebridge Package - ${{ inputs.validation_type }} - ${{ inputs.release_channel || 'N/A' }}"

# Two checks, both done by test/e2e/validate-deb.sh on a fresh runner:
# - "prerelease": BEFORE a release is published. The package files of a GitHub prerelease are
#   installed on Intel, on 64-bit ARM and (in a container) on 32-bit ARM. On the first two, the
#   published package of the same channel is installed first, so the real upgrade is tested.
# - "apt": AFTER publishing. The package is installed from https://repo.homebridge.io.
# No secret is used. Everything read here is public.

on:
  workflow_dispatch:
    inputs:
      validation_type:
        description: "Type of validation to perform"
        required: true
        type: choice
        options:
          - prerelease
          - apt
        default: apt
      release_tag:
        description: "prerelease: the GitHub release tag to take the package files from"
        required: false
        type: string
      release_channel:
        description: "APT release channel"
        required: false
        type: choice
        options:
          - stable
          - beta
          - alpha
          - legacy
        default: alpha
      expected_version:
        description: "apt: the version that must get installed (empty: any)"
        required: false
        type: string

  workflow_call:
    inputs:
      validation_type:
        description: "Type of validation to perform: prerelease or apt"
        required: true
        type: string
      release_tag:
        description: "prerelease: the GitHub release tag to take the package files from"
        required: false
        type: string
      release_channel:
        description: "APT release channel: stable, beta, alpha or legacy"
        required: false
        type: string
      expected_version:
        description: "apt: the version that must get installed (empty: any)"
        required: false
        type: string

permissions: {}

jobs:
  validate_prerelease_homebridge:
    name: Validate PreRelease Package (${{ matrix.arch }})
    if: inputs.validation_type == 'prerelease'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download prerelease assets
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          tag: ${{ inputs.release_tag }}
          fileName: 'homebridge*.deb'
          out-file-path: 'debs'

      - name: Check the number of downloaded files
        run: |
          ls -l debs
          FILE_COUNT=$(find debs -maxdepth 1 -name 'homebridge*.deb' | wc -l)
          if [ "$FILE_COUNT" -ne 3 ]; then
            echo "::error::Expected 3 package files (amd64, arm64, armhf), but found $FILE_COUNT"
            exit 1
          fi

      - name: Upgrade from the published package, then check, remove, install again and purge
        env:
          ARCH: ${{ matrix.arch }}
          CHANNEL: ${{ inputs.release_channel }}
        run: |
          DEB=$(find debs -maxdepth 1 -name "homebridge_*_${ARCH}.deb")
          sudo ./test/e2e/validate-deb.sh --upgrade-from-apt "$CHANNEL" --lifecycle "$DEB"

  # GitHub has no 32-bit ARM runners. The 64-bit ARM runners can run 32-bit ARM programs, so the
  # package is installed and started in a 32-bit Debian container (no systemd in there).
  validate_prerelease_armhf:
    name: Validate PreRelease Package (armhf, in a container)
    if: inputs.validation_type == 'prerelease'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download prerelease assets
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          tag: ${{ inputs.release_tag }}
          fileName: 'homebridge_*_armhf.deb'
          out-file-path: 'debs'

      - name: Install, start and check in a 32-bit ARM container
        run: |
          DEB=$(find debs -maxdepth 1 -name 'homebridge_*_armhf.deb')
          docker run --rm --platform linux/arm/v7 -v "$PWD":/work -w /work arm32v7/debian:bookworm \
            ./test/e2e/validate-deb.sh --lifecycle "$DEB"

  validate_apt:
    name: Validate APT Installation (${{ matrix.os }})
    if: inputs.validation_type == 'apt'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install from the APT repository and check
        env:
          CHANNEL: ${{ inputs.release_channel }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          ARGS=(--from-apt "$CHANNEL")
          if [ -n "$EXPECTED_VERSION" ]; then
            ARGS+=(--expect-version "$EXPECTED_VERSION")
          fi
          sudo ./test/e2e/validate-deb.sh "${ARGS[@]}"

      - name: List Available Versions
        if: always()
        run: apt-cache madison homebridge || true

      - name: Publish Notice
        env:
          CHANNEL: ${{ inputs.release_channel }}
          RUNNER_OS_LABEL: ${{ matrix.os }}
        run: |
          echo "::notice::APT Package Installed from $CHANNEL - Version $(dpkg-query -W -f '${Version}' homebridge) - $RUNNER_OS_LABEL"

      - name: Show what the repository serves for this channel
        if: failure()
        env:
          CHANNEL: ${{ inputs.release_channel }}
        run: |
          # public files only; no storage key is needed to see what users get
          curl -fsS "https://repo.homebridge.io/dists/$CHANNEL/InRelease" | head -n 20 || true
          curl -fsS "https://repo.homebridge.io/dists/$CHANNEL/main/binary-$(dpkg --print-architecture)/Packages" \
            | grep -E '^(Package|Version|Filename):' | tail -n 30 || true
