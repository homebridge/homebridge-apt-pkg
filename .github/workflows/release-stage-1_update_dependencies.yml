name: Release Stage 1 - Update Alpha, Beta, and Stable Dependencies, Create PRs, Merge PRs and Trigger Stage 2

on:
  schedule:
    # Process alpha, beta, and stable streams at 8 AM UTC daily
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type to update'
        required: true
        type: choice
        options:
          - alpha
          - beta
          - stable
          - all
        default: 'alpha'

run-name: Release Stage 1 - ${{ github.event_name == 'workflow_dispatch' && format('Manual - {0}', github.event.inputs.release_type) || 'Scheduled' }} Run

jobs:
  determine-release-types:
    name: Determine Release Types
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix based on trigger
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.release_type }}" == "all" ]]; then
              echo 'matrix={"release_type":["alpha","beta","stable"],"include":[{"release_type":"alpha","config_file":".github/homebridge-alpha-bot.json","trigger_workflow":"release-stage-2_build_and_release.yml"},{"release_type":"beta","config_file":".github/homebridge-beta-bot.json","trigger_workflow":"release-stage-2_build_and_release.yml"},{"release_type":"stable","config_file":".github/homebridge-stable-bot.json","trigger_workflow":"release-stage-2_build_and_release.yml"}]}' >> $GITHUB_OUTPUT
            else
              CONFIG_FILE=".github/homebridge-${{ github.event.inputs.release_type }}-bot.json"
              echo "matrix={\"release_type\":[\"${{ github.event.inputs.release_type }}\"],\"include\":[{\"release_type\":\"${{ github.event.inputs.release_type }}\",\"config_file\":\"$CONFIG_FILE\",\"trigger_workflow\":\"release-stage-2_build_and_release.yml\"}]}" >> $GITHUB_OUTPUT
            fi
          else
            # Scheduled run - process alpha, beta, and stable streams
            echo 'matrix={"release_type":["alpha","beta","stable"],"include":[{"release_type":"alpha","config_file":".github/homebridge-alpha-bot.json","trigger_workflow":"release-stage-2_build_and_release.yml"},{"release_type":"beta","config_file":".github/homebridge-beta-bot.json","trigger_workflow":"release-stage-2_build_and_release.yml"},{"release_type":"stable","config_file":".github/homebridge-stable-bot.json","trigger_workflow":"release-stage-2_build_and_release.yml"}]}' >> $GITHUB_OUTPUT
          fi

  update_alpha_dependencies:
    name: Update alpha Dependencies
    needs: determine-release-types
    if: contains(fromJson(needs.determine-release-types.outputs.matrix).release_type, 'alpha')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Run Homebridge alpha Bot
        id: homebridge-bot
        uses: NorthernMan54/Homebridge-Dependency-Bot@latest 
        with:
          config_file: .github/homebridge-alpha-bot.json
          release_stream: alpha
          GH_TOKEN: ${{ secrets.GH_TOKEN }}  # Separate token for PR approval

      - name: Log Skipped alpha Stage 2 Trigger
        if: steps.homebridge-bot.outputs.changes_detected != 'true' || steps.homebridge-bot.outputs.auto_merge != 'true'
        run: |
          echo "::warning::alpha Stage 2 not triggered: Changes Detected=${{ steps.homebridge-bot.outputs.changes_detected }}, Auto Merge=${{ steps.homebridge-bot.outputs.auto_merge }}"

      - name: Trigger Build and Release alpha Package
        if: steps.homebridge-bot.outputs.changes_detected == 'true' && steps.homebridge-bot.outputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "::notice::Triggering alpha Stage 2 - Build and Release alpha Package"
          gh workflow run release-stage-2_build_and_release.yml --ref latest --field release_type=alpha || { echo "::error::Failed to trigger alpha Stage 2 workflow"; exit 1; }

      - name: Checkout repository (for trigger step)
        if: steps.homebridge-bot.outputs.changes_detected == 'true' && steps.homebridge-bot.outputs.auto_merge == 'true'
        uses: actions/checkout@v4

  update_beta_dependencies:
    name: Update beta Dependencies
    needs: [determine-release-types, update_alpha_dependencies]
    if: always() && contains(fromJson(needs.determine-release-types.outputs.matrix).release_type, 'beta')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Run Homebridge beta Bot
        id: homebridge-bot
        uses: NorthernMan54/Homebridge-Dependency-Bot@latest 
        with:
          config_file: .github/homebridge-beta-bot.json
          release_stream: beta
          GH_TOKEN: ${{ secrets.GH_TOKEN }}  # Separate token for PR approval

      - name: Log Skipped beta Stage 2 Trigger
        if: steps.homebridge-bot.outputs.changes_detected != 'true' || steps.homebridge-bot.outputs.auto_merge != 'true'
        run: |
          echo "::warning::beta Stage 2 not triggered: Changes Detected=${{ steps.homebridge-bot.outputs.changes_detected }}, Auto Merge=${{ steps.homebridge-bot.outputs.auto_merge }}"

      - name: Trigger Build and Release beta Package
        if: steps.homebridge-bot.outputs.changes_detected == 'true' && steps.homebridge-bot.outputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "::notice::Triggering beta Stage 2 - Build and Release beta Package"
          gh workflow run release-stage-2_build_and_release.yml --ref latest --field release_type=beta || { echo "::error::Failed to trigger beta Stage 2 workflow"; exit 1; }

      - name: Checkout repository (for trigger step)
        if: steps.homebridge-bot.outputs.changes_detected == 'true' && steps.homebridge-bot.outputs.auto_merge == 'true'
        uses: actions/checkout@v4

  update_stable_dependencies:
    name: Update stable Dependencies
    needs: [determine-release-types, update_beta_dependencies]
    if: always() && contains(fromJson(needs.determine-release-types.outputs.matrix).release_type, 'stable')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Run Homebridge stable Bot
        id: homebridge-bot
        uses: NorthernMan54/Homebridge-Dependency-Bot@latest 
        with:
          config_file: .github/homebridge-stable-bot.json
          release_stream: stable
          GH_TOKEN: ${{ secrets.GH_TOKEN }}  # Separate token for PR approval

      - name: Log Skipped stable Stage 2 Trigger
        if: steps.homebridge-bot.outputs.changes_detected != 'true' || steps.homebridge-bot.outputs.auto_merge != 'true'
        run: |
          echo "::warning::stable Stage 2 not triggered: Changes Detected=${{ steps.homebridge-bot.outputs.changes_detected }}, Auto Merge=${{ steps.homebridge-bot.outputs.auto_merge }}"

      - name: Trigger Build and Release stable Package
        if: steps.homebridge-bot.outputs.changes_detected == 'true' && steps.homebridge-bot.outputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "::notice::Triggering stable Stage 2 - Build and Release stable Package"
          gh workflow run release-stage-2_build_and_release.yml --ref latest --field release_type=stable || { echo "::error::Failed to trigger stable Stage 2 workflow"; exit 1; }

      - name: Checkout repository (for trigger step)
        if: steps.homebridge-bot.outputs.changes_detected == 'true' && steps.homebridge-bot.outputs.auto_merge == 'true'
        uses: actions/checkout@v4
