version: 2
updates:
  # Stable 32-bit package.json
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "10:00"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    ignore:
      - dependency-name: "node"
        versions: [">23.x"]
    labels:
      - "Production"
    commit-message:
      prefix: "Production"
      include: "scope"