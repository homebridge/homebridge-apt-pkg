name: Beta Stage 1 - Auto Merge Beta Dependabot Updates

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Check and log changed files PR#${{ github.event.pull_request.number }}
        id: filecheck
        run: |
          echo "Fetching changed files..."
          git fetch --no-tags --depth=1 origin ${{ github.base_ref }}

          files=$(git diff --name-only FETCH_HEAD...HEAD)
          echo "$files"

          if echo "$files" | grep -qv '^beta/'; then
            echo "non_beta_changes=true" >> $GITHUB_OUTPUT
            echo "::notice::🚫 Auto-merge skipped: PR includes files outside of beta directory."
          else
            echo "non_beta_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Check and log PR title PR#${{ github.event.pull_request.number }}
        id: titlecheck
        run: |
          title="${{ github.event.pull_request.title }}"
          echo "PR Title: $title"
          if [[ "$title" == BETA* ]]; then
            echo "beta_title=true" >> $GITHUB_OUTPUT
          else
            echo "beta_title=false" >> $GITHUB_OUTPUT
            echo "::notice::🚫 Auto-merge skipped: PR title does not start with BETA."
          fi

      - name: Enable auto-merge for Dependabot PR#${{ github.event.pull_request.number }}
        if: steps.filecheck.outputs.non_beta_changes == 'false' && steps.titlecheck.outputs.beta_title == 'true'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash

      - name: Log auto-merge notice
        if: steps.filecheck.outputs.non_beta_changes == 'false' && steps.titlecheck.outputs.beta_title == 'true'
        run: |
          echo "::notice::✅ Auto-merge enabled for Dependabot PR #${{ github.event.pull_request.number }}"
