name: "Reusable - Publish to APT Repository"

on:
  workflow_call:
    inputs:
      codename:
        description: 'APT repository codename (stable, beta, alpha, test)'
        required: true
        type: string
      suite:
        description: 'APT repository suite'
        required: false
        type: string
        default: 'stable'
      release_version:
        description: 'Release version for display'
        required: true
        type: string
      download_from_release:
        description: 'Download files from GitHub release instead of artifacts'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag to download from (when download_from_release is true)'
        required: false
        type: string
    secrets:
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true
      GPG_KEY_ID:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  publish_to_apt:
    name: APT Repo Publish (${{ inputs.codename }}) ${{ inputs.release_version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download from GitHub Release
        if: ${{ inputs.download_from_release }}
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ inputs.release_tag }}
          fileName: 'homebridge*.deb'
          out-file-path: 'repo/'

      - name: Download artifacts
        if: ${{ !inputs.download_from_release }}
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: repo/

      - name: Display structure of downloaded files
        run: ls -R

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Install deb-s3
        run: |
          curl -sLO https://github.com/deb-s3/deb-s3/releases/download/0.11.8/deb-s3-0.11.8.gem
          sudo gem install deb-s3-0.11.8.gem

      - name: Upload to APT Repository
        run: |
          sudo chown -R $USER: repo/
          deb-s3 upload \
            --codename=${{ inputs.codename }} \
            --suite=${{ inputs.suite }} \
            --preserve-versions \
            --s3-region=us-west-2 \
            --bucket repo.homebridge.io \
            --access-key-id=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --secret-access-key=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --sign=${{ secrets.GPG_KEY_ID }} \
            repo/homebridge_v*.deb repo/*.deb