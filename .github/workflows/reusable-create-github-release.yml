name: "Reusable - Create GitHub Release"

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag name'
        required: true
        type: string
      release_name:
        description: 'Release name/title'
        required: true
        type: string
      release_type:
        description: 'Release type (stable, beta, alpha)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Mark as draft'
        required: false
        type: boolean
        default: false
      body_prefix:
        description: 'Additional content to prepend to release body'
        required: false
        type: string
        default: ''

jobs:
  create_github_release:
    name: Create GitHub Release ${{ inputs.tag_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: artifacts/

      - name: Read manifest content
        id: read_manifest
        run: |
          echo "MANIFEST_FILE=$(ls artifacts/*.manifest | head -n 1)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
          files: |
            artifacts/homebridge_v*.deb
            artifacts/homebridge_v*.manifest
          body_path: ${{ steps.read_manifest.outputs.MANIFEST_FILE }}
          body: |
            ${{ inputs.body_prefix }}
            Homebridge Apt Package Manifest

            Release Version: ${{ inputs.tag_name }}
            Release Type: ${{ inputs.release_type }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}