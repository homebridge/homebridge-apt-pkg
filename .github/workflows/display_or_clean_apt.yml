name: Display or Clean APT Repository
run-name: APT Repository ${{ inputs.stream }} Codename - ${{ inputs.cleanup == true && 'Clean' || 'Display' }}

# Shows what the apt repository holds for one channel. With "Erase stream" ticked, it deletes that
# channel (index and packages) from S3 and from R2, and then purges the Cloudflare cache.
# Without the purge, Cloudflare keeps serving the old index, which points at files that are gone,
# and "apt update" fails for users of that channel until the next release.
#
# Order of the jobs: verify -> display or delete -> purge the cache.

on:
  workflow_dispatch:
    inputs:
      stream:
        description: 'Choose release'
        required: true
        type: choice
        options:
          - beta
          - alpha
          - legacy
        default: beta
      cleanup:
        description: 'Erase stream'
        type: boolean
        required: true
        default: false

permissions: {}

jobs:
  verify_apt:
    name: Verify APT Repository - ${{ inputs.stream }} Codename
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install deb-s3
        uses: ./.github/actions/install-deb-s3

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify deb-s3 Installation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          STREAM: ${{ inputs.stream }}
        run: |
          deb-s3 verify \
              --codename="$STREAM" \
              --suite="$STREAM" \
              --s3-region=us-west-2 \
              --bucket repo.homebridge.io \
              --access-key-id="$AWS_ACCESS_KEY_ID" \
              --secret-access-key="$AWS_SECRET_ACCESS_KEY" \
              --sign="$GPG_KEY_ID"

  display_or_clean_apt:
    name: Display or Clean ${{ inputs.stream }} Codename - ${{ inputs.cleanup == true && 'Clean' || 'Display' }}
    # after the verify job, never at the same time; still runs when verify found a problem
    needs: verify_apt
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    env:
      STREAM: ${{ inputs.stream }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Display Current ${{ inputs.stream }} Codename
        run: |
          aws s3 ls --recursive "s3://repo.homebridge.io/dists/$STREAM/" || echo "No $STREAM codename found"
          aws s3 ls --recursive "s3://repo.homebridge.io/pool/$STREAM/" || echo "No $STREAM codename found"

      - name: Delete ${{ inputs.stream }} Metadata
        if: ${{ inputs.cleanup == true }}
        run: |
          aws s3 rm "s3://repo.homebridge.io/dists/$STREAM/" --recursive
          echo "Deleted dists/$STREAM/"

      - name: Delete ${{ inputs.stream }} Packages
        if: ${{ inputs.cleanup == true }}
        run: |
          aws s3 rm "s3://repo.homebridge.io/pool/$STREAM/" --recursive
          echo "Deleted pool/$STREAM/"

      - name: Verify Deletion
        if: ${{ inputs.cleanup == true }}
        run: |
          aws s3 ls "s3://repo.homebridge.io/dists/$STREAM/" || echo "dists/$STREAM/ is empty"
          aws s3 ls "s3://repo.homebridge.io/pool/$STREAM/" || echo "pool/$STREAM/ is empty"

      - name: Display Every Codename
        run: |
          for ch in stable beta alpha legacy; do
            echo "::group::Display $ch Codename"
            aws s3 ls --recursive "s3://repo.homebridge.io/dists/$ch/" || echo "No $ch codename found"
            echo "::endgroup::"
          done

  # After a delete: purge the cached index files of repo.homebridge.io
  purge_cloudflare_cache:
    name: Purge Cloudflare Cache
    needs: display_or_clean_apt
    if: ${{ always() && inputs.cleanup == true && needs.display_or_clean_apt.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-purge_cloudflare_cache.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # R2 copy of the display/clean steps above. Runs alongside S3; remove the S3 jobs at cutover.
  display_or_clean_apt_r2:
    name: R2 - Display or Clean ${{ inputs.stream }} Codename - ${{ inputs.cleanup == true && 'Clean' || 'Display' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      STREAM: ${{ inputs.stream }}
      # the host that serves the R2 bucket (the same default as reusable-publish_apt_r2.yml)
      PUBLIC_HOST: apt-test.homebridge.io
    steps:
      - uses: actions/checkout@v7

      - name: Delete ${{ inputs.stream }} Metadata and Packages
        if: ${{ inputs.cleanup == true }}
        run: |
          aws s3 rm "s3://$R2_BUCKET/dists/$STREAM/" --recursive --endpoint-url "$R2_ENDPOINT"
          aws s3 rm "s3://$R2_BUCKET/pool/$STREAM/" --recursive --endpoint-url "$R2_ENDPOINT"
          echo "Deleted dists/$STREAM/ and pool/$STREAM/ from R2"

      - name: Purge Cloudflare Cache (R2 host)
        if: ${{ inputs.cleanup == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sed "s#://repo.homebridge.io/#://${PUBLIC_HOST}/#" repo/cf-cache-purge-urls.json \
            > repo/cf-cache-purge-urls-r2.json
          ./purge-cf-cache.sh repo/cf-cache-purge-urls-r2.json

      - name: Display Codenames
        run: |
          for ch in stable beta alpha legacy; do
            echo "::group::R2 $ch codename"
            aws s3 ls --recursive "s3://$R2_BUCKET/dists/$ch/" --endpoint-url "$R2_ENDPOINT" || echo "No $ch codename found"
            echo "::endgroup::"
          done
          aws s3 ls "s3://$R2_BUCKET" --recursive --summarize --endpoint-url "$R2_ENDPOINT" | tail -2
