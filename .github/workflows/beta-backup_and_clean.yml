name: Beta - Backup and Reset Beta APT Repository

on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: 'Erase beta codename (true/false)'
        required: true
        default: 'false'

jobs:
  backup_and_reset_beta:
    name: Backup and Reset Beta Codename
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Display Current Beta Codename
        run: |
          aws s3 ls s3://repo.homebridge.io/dists/beta/ || echo "No beta codename found"
          aws s3 ls s3://repo.homebridge.io/pool/beta/ || echo "No beta codename found"

      - name: Delete Beta Metadata
        if: github.event.inputs.cleanup == 'true'
        run: |
          aws s3 rm s3://repo.homebridge.io/dists/beta/ --recursive
          echo "Deleted dists/beta/"

      - name: Delete Beta Packages
        if: github.event.inputs.cleanup == 'true'
        run: |
          aws s3 rm s3://repo.homebridge.io/pool/beta/ --recursive
          echo "Deleted pool/beta/"

      - name: Delete Beta Backup
        if: github.event.inputs.cleanup == 'true'
        run: |
          aws s3 rm s3://repo.homebridge.io/backup/beta-20250619-190620/ --recursive
          echo "Deleted backup/beta-20250619-190620/"

      - name: Verify Deletion
        if: github.event.inputs.cleanup == 'true'
        run: |
          aws s3 ls s3://repo.homebridge.io/dists/beta/ || echo "dists/beta/ is empty"
          aws s3 ls s3://repo.homebridge.io/pool/beta/ || echo "pool/beta/ is empty"

      - name: Verify Stable Codename
        run: |
          aws s3 ls s3://repo.homebridge.io/dists/stable/ | grep -q stable && echo "stable codename is intact"